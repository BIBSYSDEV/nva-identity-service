plugins {
    id 'nva.identity.service.java-common-conventions'
}

dependencies {
    api(nvaCatalog.aws.sdk2.dynamo)
    api(nvaCatalog.aws.sdk2.dynamodbenhanced)
    api(nvaCatalog.jackson.annotations)
    api(nvaLibs.apigateway)
    api(nvaLibs.json)
    implementation(nvaCatalog.aws.sdk2.sdk.core)
    implementation(nvaCatalog.slf4j.api)
    implementation(nvaLibs.core)
    implementation(project(':dynamo-client'))
    implementation(project(':json-config'))
    testImplementation(nvaCatalog.hamcrest)
    testImplementation(nvaCatalog.jackson.core)
    testImplementation(nvaCatalog.jackson.databind)
    testImplementation(nvaCatalog.javers)
    testImplementation(nvaCatalog.junit.jupiter.api)
    testImplementation(nvaCatalog.junit.jupiter.params)
    testImplementation(nvaCatalog.mockito.core)
    testImplementation(nvaLibs.testutils)
    testImplementation(project(":customer-testing"))
}


test {
    environment "API_DOMAIN", "localhost"
    environment "CUSTOMERS_TABLE_NAME", "nva_customers"
    environment "ID_NAMESPACE", "https://localhost"
    environment "API_HOST", "host"
    environment "PUBLICATION_CHANNEL_PATH", "publication-channels-path"
}
